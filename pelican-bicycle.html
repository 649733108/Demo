<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>骑自行车的鹈鹕</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4efe4;
      --ink: #2c3338;
      --muted: #5c675f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse at 50% 0%, #fffaf0 0%, var(--paper) 55%, #e7e0d0 100%);
      color: var(--ink);
      font-family: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Palatino, "Palatino Linotype", serif;
    }

    header {
      text-align: center;
      padding: 1.4rem 1rem 0.2rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 3vw, 2.4rem);
      font-weight: 600;
      letter-spacing: 0.28em;
    }

    header p {
      margin: 0.45rem 0 0;
      color: var(--muted);
      letter-spacing: 0.42em;
      font-size: 0.78rem;
      font-family: "PingFang SC", "Noto Sans SC", "Source Han Sans SC", system-ui, sans-serif;
    }

    main {
      width: min(980px, 100%);
      padding: 0.8rem 1rem 2rem;
    }

    figure {
      margin: 0;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 18px;
      box-shadow: 0 16px 40px rgba(60, 48, 28, 0.14);
    }

    figcaption {
      margin-top: 0.75rem;
      text-align: center;
      color: var(--muted);
      font-size: 0.95rem;
      letter-spacing: 0.08em;
    }
  </style>
</head>
